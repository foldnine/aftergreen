# Verify a deployment after the deploy job reports success.
# Needs AfterGreen v0.2.0 or later (`aftergreen verify` is not released yet).
stages: [deploy, verify]

deploy:
  stage: deploy
  script:
    - echo "your deploy here"

verify:
  stage: verify
  image: alpine:3
  variables:
    DEPLOY_SHA: $CI_COMMIT_SHA
    DEPLOY_ID: $CI_PIPELINE_ID
    # AFTERGREEN_POSTGRES_URL: set as a masked CI/CD variable if you use postgres checks
  script:
    - apk add --no-cache curl
    - curl -fsSL https://aftergreen.foldnine.dev/install.sh | sh -s -- --version v0.2.0 --bin-dir /usr/local/bin
    # Exit codes: 0 verified, 1 failed, 2 invalid input, 3 unknown.
    - aftergreen verify -f aftergreen.yaml --report aftergreen-report.json
  artifacts:
    when: always
    paths: [aftergreen-report.json]
