# AfterGreen verification contract. Run: aftergreen verify -f aftergreen.yaml
# Local demo (see README.md in this directory):
#   python3 -m http.server 8000 --bind 127.0.0.1 --directory site
#   DEPLOY_SHA=a82f19c aftergreen verify -f aftergreen.yaml
version: 1

deployment:
  name: payment-api
  revision: "${DEPLOY_SHA}"

checks:
  # The endpoint answers 200 for any build. The revision check is what proves
  # that this deployment is the one serving traffic.
  - id: service-up
    type: http
    url: http://127.0.0.1:8000/version.json
    expect:
      status: 200

  # Right after a deploy the old build may still answer for a while. Retry
  # every 2s for up to 6s and require two matching observations in a row.
  - id: correct-revision
    type: http
    url: http://127.0.0.1:8000/version.json
    timeout: 5s
    expect:
      status: 200
      json:
        - path: $.revision
          equals: "${DEPLOY_SHA}"
    retry:
      interval: 2s
      deadline: 6s
      consecutive: 2
