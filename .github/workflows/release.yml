name: Release
# Builds CLI binaries with checksums and SLSA build provenance.
# - pull_request / workflow_dispatch: dry run, artifacts only, nothing published.
# - push of a vX.Y.Z tag (by the owner): creates a DRAFT GitHub Release. A human
#   reviews and publishes it; this workflow never publishes on its own.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    paths: ['.github/workflows/release.yml', 'scripts/build-release.sh']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # provenance signing (Sigstore), tag builds only
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false     # release builds never reuse a cache
      - name: Test
        run: go vet ./... && go test -race -count=1 ./...
      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then v="$GITHUB_REF_NAME"; else v="0.0.0-dryrun+${GITHUB_SHA::12}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/build-release.sh "$VERSION" dist
      - name: Smoke test linux/amd64 binary
        run: |
          tar -xzf dist/aftergreen_*_linux_amd64.tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/aftergreen" version | grep -F "${{ steps.version.outputs.version }}"
      - name: Attest build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aftergreen-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error

  draft-release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release (owner publishes manually)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "$TAG" --notes "Draft created by CI. Verify: sha256sum -c SHA256SUMS and gh attestation verify <file> --repo $GITHUB_REPOSITORY"
